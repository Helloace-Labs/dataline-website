<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dataline — Twitter banner (1500×500)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;500&family=Fragment+Mono&display=swap');

  :root {
    --bg: #0A0A0A;
    --ink: #E8E6E0;
    --ink-dim: #888880;
    --green: #34d399;
    --hairline: rgba(232, 230, 224, 0.10);
    --font-main: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'Fragment Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #050505; height: 100%; }
  body {
    font-family: var(--font-main);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }

  .banner {
    position: relative;
    width: 1500px; height: 500px;
    background: var(--bg);
    overflow: hidden;
    flex: 0 0 auto;
    box-shadow: 0 0 0 1px var(--hairline);
  }

  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  .meta {
    position: absolute;
    right: 64px; top: 56px;
    z-index: 5;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
    text-align: right;
    line-height: 1.7;
    text-transform: uppercase;
  }
  .meta .live { color: var(--green); }
  .meta .live::before {
    content: '●'; margin-right: 0.4rem;
  }

  .url {
    position: absolute;
    right: 64px; bottom: 64px;
    z-index: 5;
    font-family: var(--font-mono);
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
  }
  .url .slash { color: var(--green); }

  .controls {
    position: fixed;
    top: 1rem; left: 1rem;
    background: #111;
    border: 1px solid var(--hairline);
    padding: 0.75rem 1rem;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--ink-dim);
    z-index: 100;
    line-height: 1.6;
    max-width: 360px;
  }
  .controls b { color: var(--ink); font-weight: 500; }
  .controls button {
    background: transparent; border: 1px solid var(--hairline);
    color: var(--ink); font-family: inherit; font-size: 0.7rem;
    padding: 0.3rem 0.7rem; cursor: pointer; margin-right: 0.4rem;
    margin-top: 0.4rem;
  }
  .controls button:hover { border-color: var(--green); color: var(--green); }
</style>
</head>
<body>

<div class="controls">
  <b>Dataline · Twitter banner</b><br>
  Banner is 1500×500. Open DevTools → element-pick the <code>.banner</code> div → Cmd+Shift+P → "Capture node screenshot."
  <br><br>
  <button onclick="reseed()">re-seed wave</button>
  <button onclick="freezeFrame()">freeze / play</button>
  <button onclick="toggleText()">toggle text</button>
</div>

<div class="banner" id="banner">
  <canvas id="banner-canvas"></canvas>

  <div class="meta">
    <div><span class="live">live</span></div>
    <div>execution-grade data</div>
  </div>

  <div class="url">
    dataline<span class="slash">.</span>xyz
  </div>
</div>

<script>
  /* ─── ASCII waveline — same logic as the homepage hero, with BANDS=1. ─── */
  const canvas = document.getElementById('banner-canvas');
  const ctx = canvas.getContext('2d');
  const W = 1500, H = 500;
  const DPR = window.devicePixelRatio || 1;

  function setupCanvas() {
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(DPR, DPR);
  }
  setupCanvas();

  /* Match hero density: COLS=120 on desktop. We have a wider banner, scale up. */
  const COLS = 220;
  const cellW = W / COLS;
  const cellH = cellW * 1.55;
  const rows = Math.ceil(H / cellH);

  /* Single band fills the whole canvas, exactly like setting BANDS=1 in hero. */
  const BANDS = 1;
  const bandH = rows / BANDS;

  const waveChars = ' .,;:!|/\\-_~^`'.split('');
  const ACCENT_COLS = ['#114433','#113322','#221133'];

  let time = 0;
  let seed = 0;
  let frozen = false;
  let textVisible = true;

  /* Verbatim hero waveAmp; `l` here is just the band index (0). seed shifts the phase. */
  function waveAmp(x, l, t, spd) {
    const nx = x / COLS;
    return (
      0.20 * Math.sin(nx * 6.2 + t * 1.1 * spd + l * 1.3 + seed * 6.28) +
      0.12 * Math.sin(nx * 14.8 - t * 1.7 * spd + l * 2.1 + seed * 3.14) +
      0.07 * Math.sin(nx * 28 + t * 2.3 * spd - l * 0.7 + seed * 1.57) +
      0.04 * Math.sin(nx * 53 - t * 3.1 * spd + l * 4.0 + seed * 9.42)
    );
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';

    const effectiveSpeed = 1.0;
    if (!frozen) time += 0.012 * effectiveSpeed;

    const CHAR_SIZE = Math.max(8, Math.round(cellH * 0.70));
    ctx.font = `${CHAR_SIZE}px "Fragment Mono", ui-monospace, monospace`;

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < COLS; col++) {
        const px = col * cellW + cellW / 2;
        const py = row * cellH + cellH / 2;

        const band = Math.floor(row / bandH);   // always 0
        const bandT = (row % bandH) / bandH;    // 0..1 over full canvas

        const amp = waveAmp(col, band, time, effectiveSpeed);
        const center = 0.5 + amp;
        const dist2c = Math.abs(bandT - center);
        const thickness = 0.22;
        const density = Math.exp(-dist2c * dist2c / (thickness * thickness * 0.5));

        const charIdx = Math.floor(density * (waveChars.length - 1));
        const char = waveChars[Math.min(charIdx, waveChars.length - 1)];
        const opacity = density * 0.70;

        if (char && char !== ' ' && opacity > 0.04) {
          ctx.fillStyle = `rgba(232,230,224,${opacity})`;
          ctx.fillText(char, px, py);
        }
      }
    }

    if (!frozen) requestAnimationFrame(draw);
  }
  draw();

  function reseed() {
    seed = Math.random();
    if (frozen) draw();
  }
  function freezeFrame() {
    frozen = !frozen;
    if (!frozen) draw();
  }
  function toggleText() {
    textVisible = !textVisible;
    document.querySelector('.meta').style.display = textVisible ? '' : 'none';
    document.querySelector('.url').style.display = textVisible ? '' : 'none';
  }
</script>

</body>
</html>
